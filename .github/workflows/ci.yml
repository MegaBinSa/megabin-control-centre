name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color \
            .github/workflows/submit-staging-website-uat.yml \
            .github/workflows/submit-staging-skip-uat.yml

      - name: Verify repository quality
        run: pnpm check

      - name: Build packages
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Office browser workflows
        run: pnpm e2e

      - name: Type-check Edge Functions
        run: |
          deno check --config supabase/functions/platform-runtime/deno.json supabase/functions/platform-runtime/index.ts
          deno check --config supabase/functions/website-onboarding/deno.json supabase/functions/website-onboarding/index.ts

      - name: Bundle Edge Functions for deployment
        run: |
          deno bundle --config supabase/functions/platform-runtime/deno.json supabase/functions/platform-runtime/index.ts --output "$RUNNER_TEMP/platform-runtime.bundle.js"
          deno bundle --config supabase/functions/website-onboarding/deno.json supabase/functions/website-onboarding/index.ts --output "$RUNNER_TEMP/website-onboarding.bundle.js"

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local database
        run: pnpm supabase:db:start

      - name: Replay migrations from scratch
        run: pnpm supabase:reset

      - name: Test database and RLS policies
        run: pnpm supabase:test:db
