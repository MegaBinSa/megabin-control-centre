name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_hosted_financial:
        description: Run read-only Financial Eligibility UAT against protected Shared Staging
        type: boolean
        default: false
      deployed_sha:
        description: Exact deployed main SHA required by the optional hosted UAT
        type: string
        required: false
      prepare_financial_fixture:
        description: Apply only the user-approved ZC-100/Client One and ZC-200/Client Two synthetic fixture
        type: boolean
        default: false
      confirm_financial_fixture:
        description: PREPARE-UAT-FIN-001:<deployed-sha>:ZC-100-ONE:ZC-200-TWO
        type: string
        required: false

permissions:
  contents: read

jobs:
  hosted-financial-uat:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_hosted_financial
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: megabin-shared-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an existing green main release
        env:
          SOURCE_SHA: ${{ inputs.deployed_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${#SOURCE_SHA}" -eq 40
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          checks="$(gh api "repos/${{ github.repository }}/commits/$SOURCE_SHA/check-runs" --jq '[.check_runs[] | select(.name == "quality" or .name == "database") | {name, conclusion, started_at}] | sort_by(.name, .started_at) | group_by(.name) | map(last)')"
          echo "$checks" | jq -e 'length == 2 and all(.conclusion == "success")'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Apply specifically approved synthetic financial fixture
        if: inputs.prepare_financial_fixture
        env:
          EXPECTED_BUILD_SHA: ${{ inputs.deployed_sha }}
          CONFIRM_FINANCIAL_FIXTURE: ${{ inputs.confirm_financial_fixture }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          STAGING_ACCOUNTING_PASSWORD: ${{ secrets.STAGING_ACCOUNTING_PASSWORD }}
        run: node scripts/financial-uat-fixture.mjs
      - name: Verify hosted financial boundary without operational writes
        env:
          EXPECTED_BUILD_SHA: ${{ inputs.deployed_sha }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          STAGING_OFFICE_PASSWORD: ${{ secrets.STAGING_OFFICE_PASSWORD }}
          STAGING_DRIVER_PASSWORD: ${{ secrets.STAGING_DRIVER_PASSWORD }}
        run: node scripts/financial-eligibility-hosted-uat.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-eligibility-hosted-uat-${{ github.run_id }}
          path: .cache/financial-hosted-uat/
          if-no-files-found: error
          retention-days: 90

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color \
            .github/workflows/submit-staging-website-uat.yml \
            .github/workflows/submit-staging-skip-uat.yml \
            .github/workflows/submit-staging-accounting-uat.yml \
            .github/workflows/diagnose-supabase-pat.yml

      - name: Verify repository quality
        run: pnpm check

      - name: Build packages
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Office browser workflows
        run: pnpm e2e

      - name: Type-check Edge Functions
        run: |
          deno check --config supabase/functions/platform-runtime/deno.json supabase/functions/platform-runtime/index.ts
          deno check --config supabase/functions/website-onboarding/deno.json supabase/functions/website-onboarding/index.ts

      - name: Bundle Edge Functions for deployment
        run: |
          deno bundle --config supabase/functions/platform-runtime/deno.json supabase/functions/platform-runtime/index.ts --output "$RUNNER_TEMP/platform-runtime.bundle.js"
          deno bundle --config supabase/functions/website-onboarding/deno.json supabase/functions/website-onboarding/index.ts --output "$RUNNER_TEMP/website-onboarding.bundle.js"

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local database
        run: pnpm supabase:db:start

      - name: Replay migrations from scratch
        run: pnpm supabase:reset

      - name: Test database and RLS policies
        run: pnpm supabase:test:db
