name: Monitor staging

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      synthetic_alert_proof:
        description: Leave blank for a normal monitor; use MBA-STG-MON-TEST-001 for controlled notification proof
        required: false
        type: choice
        options:
          - ""
          - MBA-STG-MON-TEST-001
      confirm_synthetic_alert:
        description: For proof only, type PROVE-ALERT-DELIVERY:MBA-STG-MON-TEST-001
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: megabin-staging-monitor
  cancel-in-progress: true

jobs:
  synthetic-health:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      STAGING_OFFICE_EMAIL: ${{ vars.STAGING_OFFICE_EMAIL }}
      STAGING_OFFICE_PASSWORD: ${{ secrets.STAGING_OFFICE_PASSWORD }}
      STAGING_DRIVER_EMAIL: ${{ vars.STAGING_DRIVER_EMAIL }}
      STAGING_DRIVER_PASSWORD: ${{ secrets.STAGING_DRIVER_PASSWORD }}
      MEGABIN_OFFICE_ORIGIN: ${{ vars.OFFICE_ORIGIN }}
      MEGABIN_DRIVER_ORIGIN: ${{ vars.DRIVER_ORIGIN }}
      VITE_MASTER_DATA_API_URL: ${{ vars.SUPABASE_URL }}/functions/v1/platform-runtime
      VITE_DRIVER_API_URL: ${{ vars.SUPABASE_URL }}/functions/v1/platform-runtime
      MEGABIN_ACCOUNTING_PROVIDER: zoho-books-fake
      MEGABIN_COMMUNICATIONS_MODE: capture
      MEGABIN_WEBSITE_ONBOARDING_URL: ${{ vars.SUPABASE_URL }}/functions/v1/website-onboarding
      MEGABIN_WEBSITE_ONBOARDING_INTEGRATION_KEY: ${{ vars.WEBSITE_ONBOARDING_INTEGRATION_KEY }}
      MEGABIN_WEBSITE_ONBOARDING_SECRET: ${{ secrets.WEBSITE_ONBOARDING_SECRET }}
      MEGABIN_MONITOR_EVIDENCE_PATH: monitoring-evidence.json
      MEGABIN_SYNTHETIC_ALERT_PROOF: ${{ inputs.synthetic_alert_proof }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate controlled synthetic alert proof
        if: inputs.synthetic_alert_proof != ''
        shell: bash
        run: |
          test "${{ inputs.synthetic_alert_proof }}" = "MBA-STG-MON-TEST-001"
          test "${{ inputs.confirm_synthetic_alert }}" = "PROVE-ALERT-DELIVERY:MBA-STG-MON-TEST-001"
      - name: Run non-mutating operational monitor
        run: pnpm monitor:staging
      - name: Publish monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-monitor-${{ github.run_id }}
          path: monitoring-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Record monitor execution
        if: always()
        run: |
          echo "### Staging monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "Alert destination: GitHub Actions workflow notification email" >> "$GITHUB_STEP_SUMMARY"
          echo "Alert recipient: infomegabin@gmail.com" >> "$GITHUB_STEP_SUMMARY"
          echo "Operational/escalation owner: Shaun" >> "$GITHUB_STEP_SUMMARY"
          echo "Delivery receipt: requires human mailbox confirmation" >> "$GITHUB_STEP_SUMMARY"
          echo "Evidence artifact: staging-monitor-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
