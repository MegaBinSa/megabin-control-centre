<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#12382f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MegaBin Driver</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const build = import.meta.env.VITE_BUILD_SHA || "local";
      if ("serviceWorker" in navigator) {
        try {
          await navigator.serviceWorker.register(
            `/sw.js?build=${encodeURIComponent(build || "local")}`
          );
          if (!navigator.serviceWorker.controller)
            await new Promise((resolve) => {
              navigator.serviceWorker.addEventListener("controllerchange", () => resolve(), {
                once: true
              });
            });
        } catch {
          // The app remains usable online when worker installation fails.
        }
      }
      if (import.meta.env.DEV) await import("/@vite/client");
      await import("/src/main.ts");
    </script>
  </body>
</html>
