packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  supabase: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260811.1-alpha
  - wrangler@4.123.0

# Pin audited transitive fixes without upgrading the surrounding toolchains.
overrides:
  "vitest>tinypool": 2.1.2
  "miniflare>sharp": 0.35.5
  "miniflare>undici": 7.29.1
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
